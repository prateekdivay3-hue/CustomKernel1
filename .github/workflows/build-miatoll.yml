name: Build Miatoll Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a0d315-customkernel1
    paths:
      - ".github/workflows/build-miatoll.yml"
      - "AnyKernel3/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ccache clang clang-18 flex git kmod libelf-dev libc6-dev \
            lld lld-18 llvm llvm-18 make libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Verify LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          # This kernel is only ever built with Clang 18 (the LLVM that ships on
          # ubuntu-24.04). Nothing else is installed and nothing else is used,
          # so fail fast if the runner image ever drifts.
          clang_major="$(clang --version | head -n1 | sed -n 's/.*clang version \([0-9]\+\)\..*/\1/p')"
          if [ "$clang_major" != "18" ]; then
            echo "::error::expected clang 18, got: $(clang --version | head -n1)" >&2
            exit 1
          fi
          {
            echo "Toolchain source: Ubuntu 24.04 LLVM (clang-18 only)"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
            for tool in clang clang-18 ld.lld ld.lld-18 llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              command -v "$tool" || true
            done
          } | tee toolchain-info.txt

      - name: Generate and verify Miatoll configuration
        shell: bash
        run: |
          set -uo pipefail

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG" 2>&1 | tee defconfig.log
          make_status=${PIPESTATUS[0]}
          if [ "$make_status" -ne 0 ]; then
            echo "::error::make $DEFCONFIG failed with status $make_status"
            grep -Ei 'error|warning|unknown|undefined' defconfig.log | head -n 20 \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/' || true
            exit 1
          fi

          # One annotation carrying the whole dump: the annotations API only
          # keeps the first handful, so joining them keeps the full picture.
          dump=""
          for sym in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_KPROBES_HOOK \
                     CONFIG_KSU_SYSCALL_TABLE_HOOK CONFIG_KSU_DEBUG CONFIG_KSU_SUSFS \
                     CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT \
                     CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SUS_MAP \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                     CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_NOMOUNT CONFIG_KPROBES \
                     CONFIG_THREAD_INFO_IN_TASK CONFIG_64BIT; do
            val="$(grep -m1 -- "$sym" out/.config || true)"
            dump+="${sym}=${val:-absent} | "
          done
          echo "::warning::kconfig dump: ${dump}"

          missing=()
          require_config() {
            grep -qx -- "$1" out/.config || missing+=("$1")
          }

          # "Off" must not be asserted with an exact line match: kconfig drops
          # choice members from .config entirely when the choice's depends on
          # is false. KSU_SYSCALL_TABLE_HOOK and KSU_KPROBES_HOOK live in a
          # choice gated on !KSU_MANUAL_HOOK, so with manual hooks on they are
          # simply absent -- which means n, exactly what we want. Assert on
          # "is it enabled?", which is the property that actually matters.
          require_config_off() {
            if grep -qx -- "$1=y" out/.config || grep -qx -- "$1=m" out/.config; then
              missing+=("$1 must be off")
            fi
          }

          # KernelSU-Next v3.4.0-legacy: manual hook mode on this non-GKI 4.14
          # tree. No kprobes, and the syscall-table mode is rejected because it
          # needs the >= 4.17 pt_regs syscall ABI.
          require_config 'CONFIG_KSU=y'
          require_config 'CONFIG_KSU_MANUAL_HOOK=y'
          require_config_off 'CONFIG_KSU_KPROBES_HOOK'
          require_config_off 'CONFIG_KSU_SYSCALL_TABLE_HOOK'
          require_config_off 'CONFIG_KSU_DEBUG'
          require_config 'CONFIG_KSU_SUSFS=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require_config 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require_config 'CONFIG_NOMOUNT=y'
          require_config_off 'CONFIG_KPROBES'
          require_config 'CONFIG_EROFS_FS=y'
          require_config 'CONFIG_EROFS_FS_ZIP=y'
          require_config 'CONFIG_EROFS_FS_SECURITY=y'
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          require_config_off 'CONFIG_MODULE_SIG_FORCE'

          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error::Required configuration missing: $m"
            done
            exit 1
          fi

      - name: Build kernel, DTB, DTBO and modules
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G

          set +e
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' CROSS_COMPILE=aarch64-linux-gnu- \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo 'Kernel build failed. Relevant diagnostics:'
            grep -Ei 'error:|undefined reference|No rule to make target|Error [0-9]+' build.log \
              | tail -n 30 \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/' || true
            tail -n 300 build.log
            exit "$build_status"
          fi

          tail -n 100 build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify build products and KernelSU-Next linkage
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img
          test -s out/arch/arm64/boot/dtbo.img
          test -s out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          test -s out/drivers/kernelsu/kernelsu.o
          test -s out/drivers/kernelsu/core/init.o
          test -s out/drivers/kernelsu/supercall/supercall.o
          test -s out/drivers/kernelsu/supercall/dispatch.o
          test -s out/drivers/kernelsu/hook/setuid_hook.o
          test -s out/drivers/kernelsu/hook/lsm_hooks.o
          test -s out/drivers/kernelsu/feature/sucompat.o
          test -s out/drivers/kernelsu/feature/kernel_umount.o
          test -s out/drivers/kernelsu/selinux/selinux.o
          test -s out/fs/susfs.o
          test -s out/fs/nomount/nomount.o

          # Write once instead of piping llvm-nm into grep -q: with pipefail,
          # grep's early exit makes llvm-nm report EPIPE (exit 74).
          llvm-nm out/vmlinux > vmlinux.sym
          grep -q ' ksu_handle_execveat$' vmlinux.sym
          grep -q ' ksu_handle_faccessat$' vmlinux.sym
          grep -q ' ksu_handle_stat$' vmlinux.sym
          grep -q ' ksu_handle_newfstat_ret$' vmlinux.sym
          grep -q ' ksu_handle_fstat64_ret$' vmlinux.sym
          grep -q ' ksu_handle_sys_reboot$' vmlinux.sym
          grep -q ' ksu_handle_setresuid$' vmlinux.sym
          grep -q ' ksu_lsm_hook_init$' vmlinux.sym
          grep -q ' kernelsu_init$' vmlinux.sym
          # SUSFS glue: driver -> fs/susfs.c
          grep -q ' ksu_handle_susfs_cmd$' vmlinux.sym
          grep -q ' susfs_init$' vmlinux.sym
          grep -q ' susfs_add_sus_map$' vmlinux.sym
          grep -q ' susfs_is_current_ksu_domain$' vmlinux.sym
          grep -q ' nomount_init$' vmlinux.sym

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img \
            out/arch/arm64/boot/dtbo.img | tee SHA256SUMS

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.source=ubuntu-24.04-llvm"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '^(CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_EROFS_FS|CONFIG_NTFS_FS|CONFIG_BPF_SYSCALL|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3 flashable zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package artifacts
          mkdir -p artifacts
          rsync -a \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='placeholder' \
            AnyKernel3/ package/

          # Zip-root images consumed by AnyKernel3:
          #  - Image.gz : kernel (magiskboot repack keeps the ROM's ramdisk)
          #  - dtb      : written into the boot image dtb area (boot header v3)
          #  - dtbo.img : flashed to the dtbo partition by write_boot
          cp out/arch/arm64/boot/Image.gz package/Image.gz
          cp out/arch/arm64/boot/dtb.img package/dtb
          cp out/arch/arm64/boot/dtbo.img package/dtbo.img

          # No modules packaged: KSU/SUSFS/NoMount are fully built-in and the
          # few defconfig =m leftovers (usb gspca, rmnet helpers) are not
          # needed in the flashable zip. modules/ stays empty, do.modules=0.

          # keep ramdisk/ and patch/ dirs in the zip (empty is fine)
          mkdir -p package/ramdisk package/patch

          (
            cd package
            zip -r9 \
              "../artifacts/Stormbreaker-miatoll-KSUN-SUSFS-NoMount-UNTESTED-${GITHUB_RUN_NUMBER}.zip" .
          )

          # Raw images + metadata alongside the flashable zip
          cp kernel.release SHA256SUMS build-info.txt toolchain-info.txt artifacts/
          cp out/arch/arm64/boot/{Image.gz,dtb.img,dtbo.img} artifacts/
          sha256sum artifacts/Stormbreaker-miatoll-*.zip >> artifacts/SHA256SUMS
          unzip -l artifacts/Stormbreaker-miatoll-*.zip

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish pre-release
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Fetch manager APK and companion modules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release download (authenticated) avoids anonymous rate limits
          # and follows asset redirects; exact tags pinned for reproducibility.
          gh release download v3.4.0 -R KernelSU-Next/KernelSU-Next \
            -p 'KernelSU_Next_v3.4.0_*-release.apk' -D release-assets
          mv release-assets/KernelSU_Next_v3.4.0_*-release.apk \
             release-assets/KernelSU-Next-manager.apk
          gh release download v0.0.68 -R rrr333nnn333/BRENE \
            -p 'BRENE-v0.0.68.zip' -D release-assets
          gh release download v2.0.0 -R maxsteeel/nomount \
            -p 'NoMount-v2.0.0-release.zip' -D release-assets
          mv release-assets/NoMount-v2.0.0-release.zip \
             release-assets/NoMount-v2.0.0.zip
          # sanity: all three must be zip/apk archives
          head -c2 release-assets/KernelSU-Next-manager.apk | grep -q PK
          head -c2 release-assets/BRENE-v0.0.68.zip | grep -q PK
          head -c2 release-assets/NoMount-v2.0.0.zip | grep -q PK
          ls -la release-assets/

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "> Built from commit \`${GITHUB_SHA}\` (run #${GITHUB_RUN_NUMBER}) on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
          } > release-notes.md
          cat RELEASE_NOTES.md >> release-notes.md

      - name: Create/replace pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="stormbreaker-curtana"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Stormbreaker — KernelSU-Next v3.4.0-legacy + SUSFS v2.3.0 + NoMount + BBR (curtana / Infinity X)" \
            --notes-file release-notes.md \
            release-assets/Stormbreaker-miatoll-*.zip \
            release-assets/KernelSU-Next-manager.apk \
            release-assets/BRENE-v0.0.68.zip \
            release-assets/NoMount-v2.0.0.zip
          gh release view "$TAG" --json url --jq '.url'
